<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-Панель | База Даних</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2 {
            color: #89b4fa;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .card {
            background-color: #313244;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        input, select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #45475a;
            background-color: #181825;
            color: #cdd6f4;
            font-size: 14px;
            flex: 1;
            min-width: 130px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background-color: #89b4fa;
            color: #11111b;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #b4befe;
        }

        .btn-refresh {
            background-color: #a6e3a1;
            margin-bottom: 15px;
        }

        .btn-refresh:hover {
            background-color: #94e2d5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #45475a;
        }

        th {
            background-color: #181825;
            color: #89b4fa;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-pending { background-color: #f9e2af; color: #11111b; }
        .status-completed { background-color: #a6e3a1; color: #11111b; }
        .status-cancelled { background-color: #f38ba8; color: #11111b; }

        #response-msg {
            margin-top: 10px;
            font-weight: bold;
            color: #a6e3a1;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Управління Базою Даних</h1>

    <!-- 👤 Форма додавання користувача -->
    <div class="card">
        <h2>👤 Додати нове ім'я (User)</h2>
        <div class="form-group">
            <input type="text" id="user-name" placeholder="Ім'я" required>
            <input type="number" id="user-age" placeholder="Вік" required>
            <input type="email" id="user-email" placeholder="Email">
            <button onclick="addUser()">Додати користувача</button>
        </div>
    </div>

    <!-- 🛒 Форма додавання замовлення -->
    <div class="card">
        <h2>🛒 Додати нове замовлення (Order)</h2>
        <div class="form-group">
            <input type="number" id="order-user-id" placeholder="ID Користувача" required>
            <input type="text" id="order-item" placeholder="Назва товару (напр. Mouse)" required>
            <input type="number" step="0.01" id="order-price" placeholder="Ціна ($)" required>
            <select id="order-status">
                <option value="pending">pending (очікує)</option>
                <option value="completed">completed (виконано)</option>
                <option value="cancelled">cancelled (скасовано)</option>
            </select>
            <button onclick="addOrder()">Додати замовлення</button>
        </div>
    </div>

    <div id="response-msg"></div>

    <!-- 📊 Таблиця даних -->
    <div class="card">
        <h2>📊 Користувачі та їх замовлення</h2>
        <button class="btn-refresh" onclick="loadData()">🔄 Оновити таблицю</button>
        <table>
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Ім'я</th>
                    <th>Email</th>
                    <th>Товар</th>
                    <th>Ціна</th>
                    <th>Статус</th>
                </tr>
            </thead>
            <tbody id="data-table">
                <tr><td colspan="6">Завантаження даних...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = "https://my-code-pathon.onrender.com"; // Переконайся, що URL співпадає з твоїм Render
    const PASSWORD = "stas_secret_pass";

    async function loadData() {
        try {
            const res = await fetch(`${API_URL}/users`, {
                headers: { "x-password": PASSWORD }
            });
            const data = await res.json();
            
            const tbody = document.getElementById("data-table");
            tbody.innerHTML = "";

            if (!data.users_and_orders || data.users_and_orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6">База даних порожня</td></tr>`;
                return;
            }

            data.users_and_orders.forEach(row => {
                const userId = row[0];
                const name = row[1];
                const email = row[3];
                const item = row[5] || '—';
                const price = row[6] ? `$${row[6]}` : '—';
                const status = row[7] || '—';

                let statusClass = '';
                if (status === 'pending') statusClass = 'status-pending';
                else if (status === 'completed') statusClass = 'status-completed';
                else if (status === 'cancelled') statusClass = 'status-cancelled';

                tbody.innerHTML += `
                    <tr>
                        <td><b>${userId}</b></td>
                        <td>${name}</td>
                        <td>${email}</td>
                        <td>${item}</td>
                        <td>${price}</td>
                        <td><span class="status-badge ${statusClass}">${status}</span></td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error(err);
            document.getElementById("data-table").innerHTML = `<tr><td colspan="6" style="color:#f38ba8">Помилка завантаження даних</td></tr>`;
        }
    }

    async function addUser() {
        const name = document.getElementById("user-name").value;
        const age = document.getElementById("user-age").value;
        const email = document.getElementById("user-email").value || "не вказано";

        if (!name || !age) {
            alert("Заповни ім'я та вік!");
            return;
        }

        const res = await fetch(`${API_URL}/add-user`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "x-password": PASSWORD
            },
            body: JSON.stringify({ name, age: parseInt(age), email })
        });

        const result = await res.json();
        document.getElementById("response-msg").innerText = result.message || "Користувача додано!";
        loadData();
    }

    async function addOrder() {
        const userId = document.getElementById("order-user-id").value;
        const item = document.getElementById("order-item").value;
        const price = document.getElementById("order-price").value;
        const status = document.getElementById("order-status").value;

        if (!userId || !item || !price) {
            alert("Заповни ID користувача, товар та ціну!");
            return;
        }

        const res = await fetch(`${API_URL}/add-order`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "x-password": PASSWORD
            },
            body: JSON.stringify({
                user_id: parseInt(userId),
                item_name: item,
                price: parseFloat(price),
                status: status
            })
        });

        const result = await res.json();
        if (res.ok) {
            document.getElementById("response-msg").innerText = result.message;
            loadData();
        } else {
            alert(result.detail || "Помилка додавання замовлення");
        }
    }

    // Автоматично завантажуємо дані при відкритті сторінки
    loadData();
</script>

</body>
</html>
