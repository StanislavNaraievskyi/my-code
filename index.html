<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Секретна Адмінка БД</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #333;
            width: 360px;
        }
        h1 { color: #00ff88; margin-bottom: 20px; font-size: 22px; }
        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #252525;
            color: white;
            font-size: 14px;
        }
        .pass-input {
            border: 1px solid #ff4444;
        }
        button {
            background-color: #00ff88;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            width: 95%;
            margin-top: 10px;
        }
        button:hover { background-color: #00cc6e; }
        .btn-load {
            background-color: #333;
            color: #fff;
            margin-top: 15px;
        }
        .btn-load:hover { background-color: #444; }
        #result { margin-top: 20px; font-size: 14px; color: #a0a0a0; text-align: left; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Секретна Адмінка 🔐</h1>
        
        <input type="password" id="adminPassword" class="pass-input" placeholder="🔑 Введіть пароль адміна">
        <hr style="border: 0.5px solid #333; margin: 15px 0;">

        <input type="text" id="userName" placeholder="Введіть ім'я">
        <input type="number" id="userAge" placeholder="Введіть вік">
        <button onclick="sendUser()">Додати в базу</button>
        
        <button class="btn-load" onclick="loadUsers()">Показати всіх з бази</button>
        
        <div id="result">Введіть пароль та натисніть кнопку...</div>
    </div>

    <script>
        // 🌐 Адреса нашого хмарного сервера на Render
        const API_URL = "https://my-code-pathon.onrender.com";

        async function sendUser() {
            let password = document.getElementById('adminPassword').value.trim();
            let name = document.getElementById('userName').value;
            let age = document.getElementById('userAge').value;

            if(!password) {
                alert("Введіть пароль адміна!");
                return;
            }

            if(!name || !age) {
                alert("Заповни всі поля!");
                return;
            }

            try {
                let response = await fetch(`${API_URL}/add-user`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Password': password
                    },
                    body: JSON.stringify({ name: name, age: parseInt(age) })
                });

                let data = await response.json();

                if (response.status === 401) {
                    document.getElementById('result').innerText = "❌ Помилка: " + data.detail;
                } else {
                    document.getElementById('result').innerText = "✅ " + data.message;
                    document.getElementById('userName').value = '';
                    document.getElementById('userAge').value = '';
                }
            } catch (error) {
                document.getElementById('result').innerText = "❌ Помилка відправки!";
            }
        }

        async function loadUsers() {
            let password = document.getElementById('adminPassword').value.trim();

            if(!password) {
                alert("Введіть пароль адміна!");
                return;
            }

            try {
                let response = await fetch(`${API_URL}/users`, {
                    headers: {
                        'X-Password': password
                    }
                });

                let data = await response.json();

                if (response.status === 401) {
                    document.getElementById('result').innerText = "❌ Помилка: " + data.detail;
                } else {
                    if (data.users_and_orders.length === 0) {
                        document.getElementById('result').innerText = "База даних порожня.";
                        return;
                    }

                    let usersList = data.users_and_orders.map(user => {
                        let orderInfo = user[3] ? `<br> └ 🛒 <i>${user[3]} ($${user[4]})</i>` : '';
                        return `<b>ID: ${user[0]}</b> — ${user[1]} (${user[2]} років)${orderInfo}`;
                    }).join('<br><br>');

                    document.getElementById('result').innerHTML = usersList;
                }
            } catch (error) {
                document.getElementById('result').innerText = "❌ Помилка завантаження!";
            }
        }
    </script>

</body>
</html>
